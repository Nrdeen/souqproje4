# Nginx HTTPS Reverse Proxy Configuration for SouqAlGhanam 2.0 inside Docker Compose (OCI Always Free)
# Replace souq.example.sa with your production domain before enabling HTTPS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream souqalghanam_backend {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name souq.example.sa www.souq.example.sa;

    # Internal container health endpoint
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # ACME challenge for Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name souq.example.sa www.souq.example.sa;

    ssl_certificate     /etc/letsencrypt/live/souq.example.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/souq.example.sa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    # Exceeds max video upload limit (25 MB) + multipart framing
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket notifications endpoint
    location = /ws {
        proxy_pass http://souqalghanam_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Private media streaming (no response buffering for 206 byte ranges)
    location ^~ /api/v1/media/ {
        proxy_pass http://souqalghanam_backend;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Static hashed Vite assets
    location ^~ /assets/ {
        proxy_pass http://souqalghanam_backend;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://souqalghanam_backend;
        proxy_set_header Connection "";
    }
}
